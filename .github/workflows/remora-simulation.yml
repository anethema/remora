name: Remora simulation
on:
  push:
    branches: [remora/main]
    paths: ['remora/**', '.github/workflows/remora-simulation.yml']
  pull_request:
    branches: [remora/main]
    paths: ['remora/**', '.github/workflows/remora-simulation.yml']
  workflow_dispatch:

concurrency:
  group: remora-simulation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: remora/requirements.lock
      - name: Install headless native toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential ccache gawk iproute2 util-linux
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: remora-sitl-v1-${{ runner.os }}-${{ hashFiles('Rover/**', 'libraries/**', 'wscript', '.gitmodules') }}
      - name: Build
        run: PYTHON=$(command -v python) JOBS=4 ./remora/scripts/bootstrap.sh
      - name: Verify simulator isolation and policy
        run: |
          ./remora/scripts/doctor.sh
          ./remora/scripts/run-tests.sh -q
      - name: Real firmware smoke
        if: github.event_name == 'workflow_dispatch'
        run: ./remora/scripts/run-tests.sh --smoke
      - name: Separated rendezvous regression
        if: github.event_name == 'workflow_dispatch'
        run: ./remora/scripts/run-batch.sh --suite marine --seeds 7 --speedup 12
      - name: Empty-boat cancel and recovery on real SITL
        if: github.event_name == 'workflow_dispatch'
        run: ./remora/scripts/run-tests.sh --recovery -q
      - name: Fresh handheld rendezvous on real SITL
        if: github.event_name == 'workflow_dispatch'
        run: ./remora/scripts/run-tests.sh --update -q
      - name: Forward station keeping in combined wind and current
        if: github.event_name == 'workflow_dispatch'
        run: ./remora/scripts/run-tests.sh --station -k combined -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remora-simulation-evidence
          path: remora/artifacts/
          retention-days: 7
